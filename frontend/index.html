<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Shaharlar aro avtobus chiptalari: reysni tanlang, joyingizni belgilang, chiptani oling va avtobusga chiqishda to‘lang." />
    <meta name="theme-color" content="#f0f1fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0b1a" media="(prefers-color-scheme: dark)" />
    <title>NWay: avtobus chiptalari</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("nway_theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
