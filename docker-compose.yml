services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nway
      POSTGRES_PASSWORD: nway
      POSTGRES_DB: nway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nway -d nway"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://nway:nway@postgres:5432/nway
      JWT_SECRET: change-me-to-a-long-random-string
      JWT_ACCESS_EXPIRE_MINUTES: "30"
      JWT_REFRESH_EXPIRE_DAYS: "14"
      BOOKING_HOLD_MINUTES: "10"
      OFFLINE_BOOKING_DEADLINE_MINUTES: "120"
      LARGE_BOOKING_THRESHOLD: "4"
      DEFAULT_CURRENCY: UZS
      SEED_ADMIN_EMAIL: admin@demo.local
      SEED_ADMIN_PASSWORD: changeme
      SEED_SUPERADMIN_EMAIL: superadmin@demo.local
      SEED_SUPERADMIN_PASSWORD: changeme
      SEED_ADMIN_PHONE: "+998901111111"
      SEED_PASSENGER_PHONE: "+998901234567"
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://frontend
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  telegram-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.cli", "telegram-bot"]
    environment:
      DATABASE_URL: postgresql+asyncpg://nway:nway@postgres:5432/nway
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-http://localhost:8080}
      LOG_LEVEL: INFO
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - telegram

volumes:
  pgdata:
